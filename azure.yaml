# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: azure-search-copilotstudio
requiredVersions:
  azd: ">= 1.23.6"
services:
  document-extractor:
    project: ./app/functions/document_extractor
    language: py
    host: function
    condition: ${USE_CLOUD_INGESTION}
    hooks:
      prepackage:
        windows:
          shell: pwsh
          run: ../../../scripts/copy_prepdocslib.ps1
          interactive: false
          continueOnError: false
        posix:
          shell: sh
          run: ../../../scripts/copy_prepdocslib.sh
          interactive: false
          continueOnError: false
  figure-processor:
    project: ./app/functions/figure_processor
    language: py
    host: function
    condition: ${USE_CLOUD_INGESTION}
    hooks:
      prepackage:
        windows:
          shell: pwsh
          run: ../../../scripts/copy_prepdocslib.ps1
          interactive: false
          continueOnError: false
        posix:
          shell: sh
          run: ../../../scripts/copy_prepdocslib.sh
          interactive: false
          continueOnError: false
  text-processor:
    project: ./app/functions/text_processor
    language: py
    host: function
    condition: ${USE_CLOUD_INGESTION}
    hooks:
      prepackage:
        windows:
          shell: pwsh
          run: ../../../scripts/copy_prepdocslib.ps1
          interactive: false
          continueOnError: false
        posix:
          shell: sh
          run: ../../../scripts/copy_prepdocslib.sh
          interactive: false
          continueOnError: false
hooks:
    postprovision:
      windows:
        shell: pwsh
        run: ./scripts/prepdocs.ps1
        interactive: true
        continueOnError: false
      posix:
        shell: sh
        run: ./scripts/prepdocs.sh
        interactive: true
        continueOnError: false
    postdeploy:
      windows:
        shell: pwsh
        run: ./scripts/setup_cloud_ingestion.ps1
        interactive: true
        continueOnError: false
      posix:
        shell: sh
        run: ./scripts/setup_cloud_ingestion.sh
        interactive: true
        continueOnError: false
