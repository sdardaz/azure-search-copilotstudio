name: Python check

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - ".azdo/**"
      - ".devcontainer/**"
      - ".github/**"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - ".azdo/**"
      - ".devcontainer/**"
      - ".github/**"
  workflow_call:

jobs:
  test_package:
    name: Test ${{ matrix.os }} Python ${{ matrix.python_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
        - uses: actions/checkout@v7
          with:
            # Fetch full history so diff-cover can compute a merge base with origin/main
            fetch-depth: 0
        - name: Install uv
          uses: astral-sh/setup-uv@v7
          with:
            enable-cache: true
            version: "0.9.5"
            cache-dependency-glob: "requirements**.txt"
            python-version: ${{ matrix.python_version }}
            activate-environment: true
        - name: Install dependencies
          run: |
            uv pip install -r requirements-dev.txt
        - name: Lint with ruff
          run: ruff check .
        - name: Check types with ty
          run: ty check
        - name: Check formatting with black
          run: black . --check --verbose
        - name: Run Python tests
          if: runner.os != 'Windows'
          run: pytest -s -vv --cov --cov-report=xml --cov-fail-under=90
        - name: Check diff coverage
          if: runner.os != 'Windows'
          run: |
            BASE_REF="${{ github.base_ref }}"
            if [ -z "$BASE_REF" ]; then BASE_REF="main"; fi
            git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
            diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under=90
